name: Aplicar correcciones móviles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambios
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/compras-update.patch
          git apply --index /tmp/compras-update.patch
          git config user.name "codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Corrige acceso movil y flujo documental"
          git push
      - name: Retirar flujo temporal
        shell: bash
        run: |
          git rm .github/workflows/apply-update.yml
          git commit -m "Retira publicador temporal"
          git push
